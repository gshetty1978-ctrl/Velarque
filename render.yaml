services:
  - type: web
    name: velarque
    runtime: static
    buildCommand: "echo 'no build step'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self' https://kiaan.onrender.com"
